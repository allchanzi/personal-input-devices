# OLED (left half only) with a custom portrait status screen; the right half
# reports its USB power to it over sofle_sync.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# Caps/Num/Scroll Lock state from the host, shown on the status screen.
CONFIG_ZMK_HID_INDICATORS=y
# Render the display off the system work queue so it never delays key processing.
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
# The default display thread priority (5) equals the BLE HID send thread
# (ZMK_BLE_THREAD_PRIORITY=5), so a redraw blocked keyboard reports until it
# finished, then they went out in a burst and some got dropped. Run the display
# below it (higher number = lower priority) so key reports always preempt it.
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=12
CONFIG_LV_Z_MEM_POOL_SIZE=4096
CONFIG_LV_USE_THEME_MONO=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_IMG=y
CONFIG_LV_USE_CANVAS=y
CONFIG_LV_FONT_MONTSERRAT_10=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_12=y
